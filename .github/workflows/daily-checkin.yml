name: Skland每日自动签到

on:
  schedule:
    # 每天 UTC 16:00 执行（即北京时间 00:00）
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skland-checkin
  cancel-in-progress: false

env:
  # 可选：显式启用 Node 24 运行 JavaScript Actions，消除弃用警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checkin:
    # 固定 Ubuntu 版本，避免 ubuntu-latest 未来迁移到 26 的影响
    runs-on: ubuntu-24.04
    # 从 10 分钟放宽到 30 分钟，给 go run 首次下载依赖留足时间
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          # 关键改动：临时关闭 setup-go 的 Actions Cache
          # 规避 Egress 超限导致的 27MB Go 缓存下载失败
          cache: false

      - name: 恢复 Token 缓存
        uses: actions/cache/restore@v4
        # 缓存恢复失败时不阻塞后续签到
        continue-on-error: true
        with:
          path: token.txt
          key: token-cache-${{ github.run_id }}
          restore-keys: |
            token-cache-

      - name: 执行签到
        env:
          PHONE: ${{ secrets.PHONE }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          go env -w GOPROXY=https://goproxy.cn,direct
          go run ./cmd/skland-checkin

      - name: 保存 Token 缓存
        if: always()
        # 缓存保存失败时不把 job 标记为失败
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: token.txt
          key: token-cache-${{ github.run_id }}

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          retention-days: 3
          # logs/ 不存在时忽略，避免产生警告
          if-no-files-found: ignore
