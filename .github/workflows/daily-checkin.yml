name: Skland每日自动签到

on:
  schedule:
    # 每天 UTC 16:00 执行（即北京时间 0:00）
    - cron: '0 16 * * *'
  # 允许手动触发，方便测试
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # 恢复缓存中的 token.txt（如果存在）
      - name: 恢复 Token 缓存
        uses: actions/cache@v3
        with:
          path: token.txt
          key: token-cache

      # 执行签到程序
      - name: 执行签到
        env:
          PHONE: ${{ secrets.PHONE }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          go env -w GOPROXY=https://goproxy.cn,direct
          go run ./cmd/skland-checkin/main.go

      # 上传日志（保留3天后自动删除）
      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          retention-days: 3