name: Skland每日自动签到

on:
  schedule:
    # 每天 UTC 16:00 执行（即北京时间 00:00）
    # 森空岛签到/检票在 0 点刷新，安排在整点执行
    - cron: '0 16 * * *'
  # 允许手动触发，方便测试
  workflow_dispatch:

# 最小权限原则：仅需读取代码
permissions:
  contents: read

# 同一时刻只允许一个签到任务运行，避免重复签到冲突
concurrency:
  group: skland-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # 恢复 Token 缓存：token 有效时程序直接自动登录，跳过密码登录
      # 注意：静态 key 只在首次未命中时保存。若 token 意外失效（改密码/异地登录），
      # 程序会自动回退到密码登录，签到不受影响，仅多一次无效的自动登录尝试
      - name: 恢复 Token 缓存
        uses: actions/cache@v4
        with:
          path: token.txt
          key: token-cache

      # 执行签到程序
      # GitHub Actions 会自动设置 CI=true，程序检测到后自动走密码登录流程
      - name: 执行签到
        env:
          PHONE: ${{ secrets.PHONE }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          go env -w GOPROXY=https://goproxy.cn,direct
          go run ./cmd/skland-checkin

      # 上传日志（保留3天后自动删除）
      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          retention-days: 3
